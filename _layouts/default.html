<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.name %}{{ page.title }} · {% endif %}{{ site.name }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ site.name }}">
  <meta property="og:description" content="{{ site.headline | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url | remove: 'index.html' }}">
  <meta property="og:image" content="{{ site.url }}/data/social-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="627">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300..700&family=Google+Sans+Code&display=swap">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/">{{ site.name }}</a>
    <nav>
      <a href="/#experience">Experience</a>
      <a href="/#education">Education</a>
      <a href="/#publications">Publications</a>
      <a href="/data/JulianFritsch_CV.pdf">CV</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>© {{ site.time | date: "%Y" }} {{ site.name }}</span>
    <span>Lausanne, Switzerland</span>
  </footer>
</body>
</html>
